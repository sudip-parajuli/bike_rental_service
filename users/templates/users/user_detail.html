{% extends "base.html" %}
{% load static %}
{% block content %}

<style>
    /* User Detail Styles - Matching home.html aesthetic */
    .user-detail-section {
        min-height: 100vh;
        background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
        position: relative;
        padding: 8rem 0 4rem;
    }

    .user-detail-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 2rem;
    }

    .user-detail-title {
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 800;
        text-align: center;
        margin-bottom: 3rem;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .profile-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .profile-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .profile-header {
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
        padding: 3rem 2rem;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .profile-avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 4px solid rgba(59, 130, 246, 0.5);
        object-fit: cover;
        margin-bottom: 1.5rem;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }

    .profile-avatar:hover {
        transform: scale(1.05);
        border-color: rgba(139, 92, 246, 0.7);
        box-shadow: 0 15px 40px rgba(139, 92, 246, 0.4);
    }

    .profile-name {
        font-size: 2rem;
        font-weight: 700;
        color: white;
        margin-bottom: 0.5rem;
    }

    .profile-email {
        color: rgba(255, 255, 255, 0.7);
        font-size: 1.1rem;
        margin: 0;
    }

    .profile-body {
        padding: 3rem;
    }

    .modern-form-group {
        margin-bottom: 2rem;
    }

    .modern-form-label {
        display: block;
        font-weight: 600;
        color: white;
        margin-bottom: 0.5rem;
        font-size: 1rem;
    }

    .modern-form-control {
        width: 100%;
        padding: 1rem 1.5rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        color: white;
        font-size: 1rem;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }

    .modern-form-control:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        transform: translateY(-2px);
    }

    .modern-form-control::placeholder {
        color: rgba(255, 255, 255, 0.6);
    }

    .modern-textarea {
        resize: vertical;
        min-height: 120px;
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 3rem;
        flex-wrap: wrap;
    }

    .modern-btn {
        padding: 1rem 2.5rem;
        border-radius: 50px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        border: none;
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
    }

    .modern-btn:hover {
        transform: translateY(-3px) scale(1.05);
        text-decoration: none;
    }

    .modern-btn.primary {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        color: white;
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
    }

    .modern-btn.primary:hover {
        box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        color: white;
    }

    .modern-btn.secondary {
        background: transparent;
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(10px);
    }

    .modern-btn.secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
        color: white;
    }

    .modern-alert {
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 15px;
        padding: 1rem 1.5rem;
        margin-bottom: 2rem;
        color: white;
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
    }

    .modern-alert.success {
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.3);
    }

    .modern-alert.warning {
        background: rgba(245, 158, 11, 0.1);
        border-color: rgba(245, 158, 11, 0.3);
    }

    .modern-alert.danger {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
    }

    .alert-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: none;
        border: none;
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.3s ease;
    }

    .alert-close:hover {
        opacity: 1;
    }

    /* File input styling */
    .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
    }

    .file-input-wrapper input[type=file] {
        position: absolute;
        left: -9999px;
    }

    .file-input-label {
        display: block;
        padding: 1rem 1.5rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        color: rgba(255, 255, 255, 0.8);
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
    }

    .file-input-label:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: #3b82f6;
        color: white;
    }

    .file-input-label i {
        margin-right: 0.5rem;
        color: #3b82f6;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .user-detail-section {
            padding: 6rem 0 2rem;
        }

        .user-detail-container {
            padding: 0 1rem;
        }

        .profile-header,
        .profile-body {
            padding: 2rem;
        }

        .form-actions {
            flex-direction: column;
            align-items: center;
        }

        .modern-btn {
            width: 100%;
            max-width: 300px;
            justify-content: center;
        }
    }

    /* Animation classes */
    .fade-in {
        animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="user-detail-section">
    <div class="user-detail-container">
        <h2 class="user-detail-title fade-in">User Profile</h2>

        <!-- Messages -->
        {% if messages %}
            <div class="fade-in">
                {% for message in messages %}
                    <div class="modern-alert {{ message.tags }}">
                        {{ message }}
                        <button type="button" class="alert-close" onclick="this.parentElement.style.display='none'">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Profile Card -->
        <div class="profile-card fade-in">
            <div class="profile-header">
                <img src="{{ user.profile_picture.url }}"
                     alt="{{ user.username }}"
                     class="profile-avatar"
                     onerror="this.onerror=null; this.src='{% static 'images/default-user.jpg' %}';">
                <h3 class="profile-name">{{ user.full_name|default:user.username }}</h3>
                <p class="profile-email">{{ user.email }}</p>
            </div>

            <div class="profile-body">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="modern-form-group">
                        <label for="first_name" class="modern-form-label">
                            <i class="fas fa-user me-2"></i>First Name
                        </label>
                        <input type="text"
                               class="modern-form-control"
                               id="first_name"
                               name="first_name"
                               value="{{ user.first_name }}"
                               required>
                    </div>

                    <div class="modern-form-group">
                        <label for="last_name" class="modern-form-label">
                            <i class="fas fa-user me-2"></i>Last Name
                        </label>
                        <input type="text"
                               class="modern-form-control"
                               id="last_name"
                               name="last_name"
                               value="{{ user.last_name }}"
                               required>
                    </div>

                    <div class="modern-form-group">
                        <label for="phone_number" class="modern-form-label">
                            <i class="fas fa-phone me-2"></i>Phone Number
                        </label>
                        <input type="text"
                               class="modern-form-control"
                               id="phone_number"
                               name="phone_number"
                               value="{{ user.phone_number|default:'' }}"
                               placeholder="+9779841234567">
                    </div>

                    <div class="modern-form-group">
                        <label for="address" class="modern-form-label">
                            <i class="fas fa-map-marker-alt me-2"></i>Address
                        </label>
                        <textarea class="modern-form-control modern-textarea"
                                  id="address"
                                  name="address"
                                  placeholder="Enter your address">{{ user.address|default:'' }}</textarea>
                    </div>

                    <div class="modern-form-group">
                        <label for="date_of_birth" class="modern-form-label">
                            <i class="fas fa-calendar me-2"></i>Date of Birth
                        </label>
                        <input type="date"
                               class="modern-form-control"
                               id="date_of_birth"
                               name="date_of_birth"
                               value="{{ user.date_of_birth|date:'Y-m-d'|default:'' }}">
                    </div>

                    <div class="modern-form-group">
                        <label for="bio" class="modern-form-label">
                            <i class="fas fa-info-circle me-2"></i>Bio
                        </label>
                        <textarea class="modern-form-control modern-textarea"
                                  id="bio"
                                  name="bio"
                                  placeholder="Tell us about yourself">{{ user.bio|default:'' }}</textarea>
                    </div>

                    <div class="modern-form-group">
                        <label for="profile_picture" class="modern-form-label">
                            <i class="fas fa-camera me-2"></i>Profile Picture
                        </label>
                        <div class="file-input-wrapper">
                            <input type="file"
                                   class="modern-form-control"
                                   id="profile_picture"
                                   name="profile_picture"
                                   accept="image/*">
                            <label for="profile_picture" class="file-input-label">
                                <i class="fas fa-upload"></i>
                                Choose Profile Picture
                            </label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="modern-btn primary">
                            <i class="fas fa-save"></i>
                            Save Changes
                        </button>
                        <a href="{% url 'users:dashboard' %}" class="modern-btn secondary">
                            <i class="fas fa-arrow-left"></i>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // File input display name
    document.getElementById('profile_picture').addEventListener('change', function(e) {
        const label = document.querySelector('.file-input-label');
        if (e.target.files.length > 0) {
            label.innerHTML = `<i class="fas fa-check"></i> ${e.target.files[0].name}`;
        } else {
            label.innerHTML = `<i class="fas fa-upload"></i> Choose Profile Picture`;
        }
    });

    // Add fade-in animation to elements as they come into view
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver(function(entries) {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, observerOptions);

    // Apply initial styles and observe elements
    document.querySelectorAll('.fade-in').forEach((element, index) => {
        element.style.opacity = '0';
        element.style.transform = 'translateY(20px)';
        element.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        element.style.transitionDelay = `${index * 0.1}s`;
        observer.observe(element);
    });
</script>

{% endblock %}
