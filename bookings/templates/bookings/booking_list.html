{% extends "base.html" %}
{% block content %}
<h1>Your Bookings</h1>
<div class="row">
    {% for booking in bookings %}
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Booking #{{ booking.id }}</h5>
                <p class="card-text">Bike: {{ booking.bike.name }}</p>
                <p class="card-text">Total Price: ${{ booking.total_price }}</p>
                <p class="card-text">Status: {{ booking.status }}</p>
            </div>
        </div>
    </div>
    {% empty %}
    <p>No bookings found.</p>
    {% endfor %}
</div>
{% endblock %}
